<script>

var APROVADOS=['dj_guilherme_br_oficial'];
var T=THREE, cv=document.getElementById('c');
var R=new T.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
var S=new T.Scene(); S.background=new T.Color(0x050824); S.fog=new T.Fog(0x2a1f78,80,230);
var cam=new T.PerspectiveCamera(60,1,.1,400);
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
rs(); addEventListener('resize',rs);
S.add(new T.AmbientLight(0x8fa4ff,.75));
var lua=new T.DirectionalLight(0xbcd0ff,.8); lua.position.set(-30,50,20); lua.castShadow=true;lua.shadow.mapSize.set(2048,2048);
var sc=lua.shadow.camera;sc.left=-45;sc.right=45;sc.top=45;sc.bottom=-45;sc.near=1;sc.far=140;lua.shadow.bias=-.0006;S.add(lua);S.add(lua.target);
S.add(new T.HemisphereLight(0x8fa4ff,0x2a3a22,.35));
var fogoLuz=new T.PointLight(0x4aa8ff,1.8,45); fogoLuz.position.set(0,5,0); S.add(fogoLuz);

function pxTex(c){var t=new T.CanvasTexture(c);t.magFilter=T.NearestFilter;t.minFilter=T.NearestFilter;t.generateMipmaps=false;return t}
function mat(c){return new T.MeshLambertMaterial({color:c})}

// chão
var gc=document.createElement('canvas');gc.width=gc.height=256;var gx=gc.getContext('2d');
gx.fillStyle='#2f5f2e';gx.fillRect(0,0,256,256);
for(var i=0;i<5000;i++){var gl=Math.random()*60|0;gx.fillStyle='rgba('+(30+gl*.5|0)+','+(80+gl)+','+(30+gl*.4|0)+',.55)';gx.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*2,2+Math.random()*5)}
for(var i=0;i<40;i++){gx.fillStyle=['#e9e56a','#ffffff','#ff9ad0'][i%3];gx.fillRect(Math.random()*256,Math.random()*256,2,2)}
var gt=new T.CanvasTexture(gc);gt.wrapS=gt.wrapT=T.RepeatWrapping;gt.repeat.set(36,36);gt.anisotropy=8;
var chao=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshLambertMaterial({map:gt}));chao.rotation.x=-Math.PI/2;chao.receiveShadow=true;S.add(chao);
var obst=[],auroras=[];
function obsB(x,z,w,d){for(var q=-w/2;q<=w/2;q+=3)obst.push({x:x+q,z:z,r:d/2+.5})}
function emi(c){return new T.MeshBasicMaterial({color:c})}

// estrelas e lua
var st=new Float32Array(900);
for(var s=0;s<300;s++){var th=Math.random()*6.28,ph=Math.random()*1.3+.15,rr=140;st[s*3]=Math.cos(th)*Math.sin(ph)*rr;st[s*3+1]=Math.cos(ph)*rr;st[s*3+2]=Math.sin(th)*Math.sin(ph)*rr}
var stg=new T.BufferGeometry();stg.setAttribute('position',new T.BufferAttribute(st,3));
S.add(new T.Points(stg,new T.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false,fog:false})));
var lua3=new T.Mesh(new T.BoxGeometry(14,14,1),new T.MeshBasicMaterial({color:0xcfe3ff,fog:false}));lua3.position.set(60,80,-100);lua3.lookAt(0,0,0);S.add(lua3);

// prédios
function jan(w,h){var c=document.createElement('canvas');c.width=c.height=128;var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,0,128);g.addColorStop(0,'#171736');g.addColorStop(1,'#0c0c20');x.fillStyle=g;x.fillRect(0,0,128,128);
  for(var a=0;a<4;a++)for(var b=0;b<4;b++){var on=Math.random()<.55;
    if(on){x.fillStyle='rgba(255,220,150,.22)';x.fillRect(a*32+3,b*32+3,26,26)}
    x.fillStyle=on?(Math.random()<.5?'#ffd98a':'#ffeabf'):'#1d2552';x.fillRect(a*32+6,b*32+6,20,20);
    x.fillStyle='rgba(255,255,255,.14)';x.fillRect(a*32+6,b*32+6,20,3)}
  var t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(w/4,h/4);t.anisotropy=8;return t}
function predio(x,z,w,h,d,neon){
  var fa=new T.MeshBasicMaterial({map:jan(w,h)}),tp=mat(0x1b1b3a);
  var m=new T.Mesh(new T.BoxGeometry(w,h,d),[fa,fa,tp,tp,fa,fa]);m.position.set(x,h/2,z);S.add(m);
  if(neon){box(.6,h,.4,emi(neon),x-w/2+.3,h/2,z+d/2+.1);box(.6,h,.4,emi(neon),x+w/2-.3,h/2,z+d/2+.1)}
  obsB(x,z,w,d);return m}
function placa(tx,col,w,h,x,y,z,pa){
  var L=[].concat(tx),c=document.createElement('canvas');c.width=512;c.height=Math.round(512*h/w);var g=c.getContext('2d');
  g.fillStyle='#0b0b24';g.fillRect(0,0,c.width,c.height);g.strokeStyle=col;g.lineWidth=10;g.strokeRect(5,5,c.width-10,c.height-10);
  g.textAlign='center';g.textBaseline='middle';var fs=Math.min(c.height/L.length*.62,90);g.font='bold '+fs+'px Arial Black,Arial,sans-serif';
  L.forEach(function(t,i){g.fillStyle=i?'#fff':col;g.fillText(t,256,c.height*(i+.5)/L.length,470)});
  var p=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:new T.CanvasTexture(c)}));p.position.set(x,y,z);(pa||S).add(p)}

// torres
var piscas=[],feixes=[],ou=emi(0xffc83d),NEON=[0xa66bff,0x4ac8ff,0xff4fd8,0xffc83d,0x3df5b0,0xff5a5a];
function torre(x,z,w,d,h,neon,nome,cor,rot){
  var g=new T.Group();g.position.set(x,0,z);g.rotation.y=rot;S.add(g);
  box(w+1.2,.5,d+1.2,emi(neon),0,.25,0,g);var tiers=[[w,d,h*.55],[w*.78,d*.78,h*.3],[w*.5,d*.5,h*.15]],y=0,tp=mat(0x1b1b3a);
  tiers.forEach(function(t){
    var fa=new T.MeshBasicMaterial({map:jan(t[0],t[2])});
    var m=new T.Mesh(new T.BoxGeometry(t[0],t[2],t[1]),[fa,fa,tp,tp,fa,fa]);m.position.y=y+t[2]/2;g.add(m);

}
var ctr=torre(0,-52,34,22,100,0xa66bff,'COMUNIDADE','#d9c2ff',0);
placa('BEM-VINDO!','#a66bff',10,1.8,0,10,11.1,ctr);box(5,8,.4,emi(0xb05cff),0,4,11.05,ctr);
box(6,1,1,ou,0,103,0,ctr);box(1,2,1,ou,-2.5,104.5,0,ctr);box(1,3,1,ou,0,105,0,ctr);box(1,2,1,ou,2.5,104.5,0,ctr);

[[34,68,30,.1,34,50],[22,62,14,.3,24,22],[40,108,40,.08,50,60]].forEach(function(c){

for(var k=0;k<4;k++){var pr=new T.Group();pr.position.set(0,103,-52);var pv=new T.Group();pv.rotation.z=.32;pr.add(pv);box(1.2,170,1.2,bm,0,85,0,pv);S.add(pr);feixes.push(pr)}
function updFeixes(t){feixes.forEach(function(f,i){f.rotation.y=t*.35+i*1.5708})}

anel(19,0xa66bff);anel(40,0x4ac8ff);

function empurra(p){obst.forEach(function(o){var dx=p.x-o.x,dz=p.z-o.z,d=Math.hypot(dx,dz),m=o.r+.6;if(d<m&&d>0){p.x=o.x+dx/d*m;p.z=o.z+dz/d*m}});
  p.x=Math.max(-95,Math.min(95,p.x));p.z=Math.max(-95,Math.min(95,p.z))}
function giro(a,b){var d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return a+d}

// multiplayer
var ws=null,meuId=null,remotos={},netT=0,netUlt='';
function atualizaQtd(){document.getElementById('qtd').textContent=(Object.keys(remotos).length+npcs.length+(eu?1:0))+' moradores na City'}
function netStart(){
  if(!SERVER||!tokenC)return;netStop();
  var w;try{w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?token='+encodeURIComponent(tokenC))}catch(e){return}
  ws=w;
  w.onopen=function(){var f='';try{if(prevTex&&prevTex.image&&prevTex.image.toDataURL)f=prevTex.image.toDataURL('image/jpeg',.6)}catch(e){}w.send(JSON.stringify({t:'j',f:f}))};
  w.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}netMsg(m)};
  w.onclose=function(){if(ws===w){ws=null;if(eu&&tokenC)setTimeout(netStart,2000)}};
}
function netStop(){var w=ws;ws=null;if(w){w.onclose=null;try{w.close()}catch(e){}}for(var k in remotos)delRem(k,true);meuId=null;netUlt=''}
function addRem(j,avisar){
  if(remotos[j.id]||j.id===meuId)return;
  var r={id:j.id,u:j.u,a:null,tp:1,bi:-1,si:0,h:0,hc:0,ar:0,v:0,ry:0};remotos[j.id]=r;
  function mk(tex){if(remotos[j.id]!==r)return;r.a=avatar('@'+j.u,tex,0x2fa36b);r.a.userData.fis=1;r.a.position.set(r.tx===undefined?0:r.tx,0,r.tz===undefined?40:r.tz);r.tp=1;atualizaQtd()}
  if(j.f){var im=new Image();im.onload=function(){mk(foto(im))};im.onerror=function(){mk(rosto('#ffb13d',j.u[0].toUpperCase()))};im.src=j.f}
  else mk(rosto('#ffb13d',j.u[0].toUpperCase()));
  if(avisar)aviso('@'+j.u+' entrou','👋');atualizaQtd();
}
function delRem(id,quiet){var r=remotos[id];if(!r)return;if(r.a){if(r.a.userData.sent)levanta(r.a);S.remove(r.a)}delete remotos[id];if(!quiet){aviso('@'+r.u+' desligou');atualizaQtd()}}
function netMsg(m){
  if(m.t==='h'){meuId=m.id;(m.j||[]).forEach(function(j){addRem(j,false)});if(m.ev&&m.ev.tipo&&m.ev.tipo!=='parar'){ev.srvT=m.ev.t;evento(m.ev.tipo)}atualizaQtd()}
  else if(m.t==='in')addRem(m,true);
  else if(m.t==='out')delRem(m.id);
  else if(m.t==='s'){(m.p||[]).forEach(function(q){var r=remotos[q[0]];if(!r)return;r.tx=q[1];r.h=q[2];r.tz=q[3];r.ry=q[4];r.ar=q[5];r.bi=q[6];r.si=q[7]})}
  else if(m.t==='w'){var r=remotos[m.id];if(r&&r.a){r.a.userData.ac=2.2;balao(r.a,'Oi! 👋')}}
  else if(m.t==='ev'){if(m.n>ev.srvT){ev.srvT=m.n;evento(m.tipo)}}
}
function updRem(dt){
  for(var k in remotos){var r=remotos[k],a=r.a;if(!a||r.tx===undefined)continue;var u=a.userData;
    if(r.bi>=0){if(!u.sent||u.sent[0]!==r.bi||u.sent[1]!==r.si){if(u.sent)levanta(a);sentaEm(a,r.bi,r.si)}anda(a,0,dt,'s');a.position.y=-.06;r.v=0;r.tp=0;continue}
    if(u.sent)levanta(a);
    var P=a.position,ox=P.x,oz=P.z,kk=Math.min(dt*10,1);
    if(r.tp){P.x=r.tx;P.z=r.tz;r.hc=r.h;r.tp=0}else{P.x+=(r.tx-P.x)*kk;P.z+=(r.tz-P.z)*kk;r.hc+=(r.h-r.hc)*kk}
    var vv=Math.hypot(P.x-ox,P.z-oz)/Math.max(dt,.001);r.v+=(vv-r.v)*Math.min(dt*8,1);
    a.rotation.y+=(giro(a.rotation.y,r.ry)-a.rotation.y)*kk;
    u.fis=1;u.vy=r.ar?4:0;
    anda(a,r.v<.8?0:r.v,dt,(ev.on&&r.v<.8&&!r.ar)?'d':'',!!r.ar);
    a.position.y=r.hc+(u.bob||0);
  }
}
function netTick(dt){
  if(!ws||ws.readyState!==1||!eu)return;netT+=dt;
  var s=eu.userData.sent,st=[+eu.position.x.toFixed(2),+pv.h.toFixed(2),+eu.position.z.toFixed(2),+eu.rotation.y.toFixed(2),pv.h>.05?1:0,s?s[0]:-1,s?s[1]:0],k=st.join(',');
  if(netT>=.1&&(k!==netUlt||netT>=1)){netT=0;netUlt=k;ws.send(JSON.stringify({t:'p',s:st}))}
}

var pv={x:0,y:0,z:0,h:0},pulo=0,lastTap=0;
var ck=new T.Clock(),tt=0;
(function loop(){
  var dt=Math.min(ck.getDelta(),.05);tt+=dt;
  if(eu&&!window.uiOn){window.uiOn=1;document.getElementById('mn').style.display='block';pv.x=pv.y=pv.z=pv.h=0}
  if(eu){
    var x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x,y=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.y,l=Math.hypot(x,y);
    if(l>1){x/=l;y/=l;l=1}
    if(eu.userData.sent){if(l>.3||keys.Space||pulo){levanta(eu);pulo=0}else{anda(eu,0,dt,'s');eu.position.y=-.06}}
    if(!eu.userData.sent){var jm2=Math.hypot(joy.x,joy.y),run=(keys.ShiftLeft||keys.ShiftRight||jm2>.9)?1:0,tv=l>.05?(run?13:Math.min(l/.88,1)*7):0,dx=0,dz=0;
    if(l>.05){dx=Math.cos(yaw)*x+Math.sin(yaw)*y;dz=-Math.sin(yaw)*x+Math.cos(yaw)*y}
    var gr=pv.h<=.001,kk=Math.min(dt*(gr?10:2.5),1);
    pv.x+=(dx*tv-pv.x)*kk;pv.z+=(dz*tv-pv.z)*kk;
    if((keys.Space||pulo)&&gr){pv.y=11;gr=false}pulo=0;
    pv.y-=32*dt;pv.h+=pv.y*dt;
    if(pv.h<=0){if(pv.y<-8)eu.userData.sq=.25;pv.h=0;pv.y=0}
    eu.userData.fis=1;eu.userData.vy=pv.y;
    eu.position.x+=pv.x*dt;eu.position.z+=pv.z*dt;
    var vv=Math.hypot(pv.x,pv.z);
    if(vv>.8)eu.rotation.y+=(giro(eu.rotation.y,Math.atan2(pv.x,pv.z))-eu.rotation.y)*Math.min(dt*14,1);
    empurra(eu.position);
    anda(eu,vv,dt,(ev.on&&vv<.8&&pv.h<=0)?'d':'',pv.h>.05);
    eu.position.y=pv.h+(eu.userData.bob||0);}
    cam.position.set(eu.position.x+Math.sin(yaw)*Math.cos(pitch)*dist,eu.position.y+2+Math.sin(pitch)*dist,eu.position.z+Math.cos(yaw)*Math.cos(pitch)*dist);
    cam.lookAt(eu.position.x,eu.position.y+2,eu.position.z);
  }else{var a=tt*.12;cam.position.set(Math.sin(a)*60,24,Math.cos(a)*60);cam.lookAt(0,10,-10)}
  npcs.forEach(function(n){
    var P=n.a.position;
    if((n.mode==='d'&&!ev.on)||(ev.on&&n.mode!=='d')){n.w=0;pensaNpc(n)}
    if(n.w>0){n.w-=dt;if(n.alvo)n.a.rotation.y=giro(n.a.rotation.y,Math.atan2(n.alvo.position.x-P.x,n.alvo.position.z-P.z));anda(n.a,0,dt,n.a.userData.sent?'s':n.mode==='d'?'d':'');if(n.a.userData.sent)n.a.position.y=-.06;if(n.w<=0)pensaNpc(n);return}
    var tx=n.tx,tz=n.tz;if(n.alvo){tx=n.alvo.position.x;tz=n.alvo.position.z}
    var dx=tx-P.x,dz=tz-P.z,d=Math.hypot(dx,dz);n.walk+=dt;
    if(d<(n.alvo?3.2:.6)||n.walk>16){n.walk=0;
      if(n.mode==='b'&&d<1.2&&!BANCOS[n.bi].oc[n.si]){sentaEm(n.a,n.bi,n.si);n.w=8+Math.random()*10}
      else if(n.alvo&&d<3.6){var al=n.alvo;n.a.userData.ac=2.5;balao(n.a,al===eu?'Oi, '+nomeAtual+'! 👋':FRASES[Math.random()*FRASES.length|0]);
        if(al!==eu){al.userData.ac=2.5;setTimeout(function(){if(al.parent)balao(al,'Oi! 👋')},900)}n.w=4}
      else n.w=n.mode==='d'?4+Math.random()*5:1+Math.random()*3;
      return}
    var vel=n.vel||2.6;P.x+=dx/d*vel*dt;P.z+=dz/d*vel*dt;n.a.rotation.y+=(giro(n.a.rotation.y,Math.atan2(dx,dz))-n.a.rotation.y)*Math.min(dt*10,1);empurra(P);anda(n.a,vel,dt,'')});
  separa();updRem(dt);netTick(dt);
  updJets(tt);updNuv(dt);updFx(dt);updPiscas(tt);updFeixes(tt);updEvento(dt,tt);updCarros(dt);balloon.position.y=34+Math.sin(tt*.5)*1.5;heli.position.set(Math.cos(tt*.3)*45,30,Math.sin(tt*.3)*45-20);heli.rotation.y=-tt*.3+Math.PI/2;rotor.rotation.y=tt*30;var f=1+Math.sin(tt*14)*.15;f1.scale.y=f;f2.scale.y=1+Math.sin(tt*20)*.25;fogoLuz.intensity=1.6+Math.random()*.4;
  auroras.forEach(function(p,i){p.material.opacity=.55+Math.sin(tt*.6+i)*.2;p.position.y=48+Math.sin(tt*.3+i*2)*3});
  var cx=eu?eu.position.x:0,cz=eu?eu.position.z:0;lua.target.position.set(cx,0,cz);lua.position.set(cx-30,50,cz+20);neve.position.set(cx,0,cz);
  var pa=sg.attributes.position;for(var i=0;i<NN;i++){var yy=pa.array[i*3+1]-dt*2.5;pa.array[i*3+1]=yy<0?30:yy}pa.needsUpdate=true;
  R.render(S,cam);requestAnimationFrame(loop);
})();

// ADM: adicionar pessoas e códigos
var pessoasC=[];
function lerP(){if(SERVER)return pessoasC;try{return JSON.parse(localStorage.getItem('city_pessoas')||'[]')}catch(e){return[]}}
function salvaP(a){if(SERVER){pessoasC=a;fetch('/api/pessoas',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({adm:admTk,lista:a})}).catch(function(){});return}try{localStorage.setItem('city_pessoas',JSON.stringify(a))}catch(e){}}
function carregaP(){if(!SERVER){desP();return}fetch('/api/pessoas?adm='+encodeURIComponent(admTk)).then(function(r){return r.json()}).then(function(l){pessoasC=Array.isArray(l)?l:[];desP()}).catch(desP)}
function pessoaOk(u,c){c=c.trim().toUpperCase();return lerP().some(function(p){return p.u===u&&p.c===c})}
function desP(){var l=document.getElementById('p2lst');l.innerHTML='';lerP().forEach(function(p,i){var d=document.createElement('div');d.className='cm';d.textContent=p.u+' — '+p.c+'  ';
  var b=document.createElement('button');b.textContent='✕';b.style.cssText='background:none;border:0;color:#ffb1b1;font-size:1rem;cursor:pointer';b.onclick=function(){var a=lerP();a.splice(i,1);salvaP(a);desP()};d.appendChild(b);l.appendChild(d)})}
document.getElementById('admI').addEventListener('click',function(){document.getElementById('ap2').style.display='flex'});
document.getElementById('p2x').addEventListener('click',function(){document.getElementById('ap2').style.display='none'});
function p2entra(){var i=document.getElementById('p2s');admLogin(i.value.trim()).then(function(ok){if(ok){document.getElementById('p2l').style.display='none';document.getElementById('p2b').style.display='block';carregaP()}else{i.value='';i.placeholder='Senha errada'}})}

document.getElementById('p2add').addEventListener('click',function(){
  var n=document.getElementById('p2n').value.trim().replace(/^@/,'').replace(/[^\w.]/g,'').toLowerCase(),c=document.getElementById('p2c').value.trim().toUpperCase(),m=document.getElementById('p2m');
  if(!n){m.textContent='Digite o nome da pessoa.';return}
  if(!c){var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(var i=0;i<6;i++)c+=A[Math.random()*A.length|0]}
  var a=lerP().filter(function(p){return p.u!==n});a.push({u:n,c:c});salvaP(a);
  m.textContent='Adicionado: '+n+' · código '+c+'. Mande esse código pra pessoa.';document.getElementById('p2n').value=document.getElementById('p2c').value='';desP()});

// sentar nos bancos
function sentaEm(a,bi,si){var b=BANCOS[bi],lx=si?.8:-.8,lz=-.05,c=Math.cos(b.rot),sn=Math.sin(b.rot);
  a.position.set(b.x+c*lx+sn*lz,-.06,b.z-sn*lx+c*lz);a.rotation.y=b.rot;a.userData.sent=[bi,si];b.oc[si]=a}
function levanta(a){var s=a.userData.sent;if(!s)return;var b=BANCOS[s[0]];b.oc[s[1]]=null;a.userData.sent=null;
  var c=Math.cos(b.rot),sn=Math.sin(b.rot),lx=s[1]?.8:-.8;a.position.set(b.x+c*lx+sn*1.9,0,b.z-sn*lx+c*1.9);if(a===eu){pv.x=pv.y=pv.z=pv.h=0}}
function sentar(){if(!eu)return;if(eu.userData.sent){levanta(eu);return}
  var best=-1,bs=0,bd=4.5;BANCOS.forEach(function(b,i){[0,1].forEach(function(s){if(b.oc[s])return;var d=Math.hypot(b.x-eu.position.x,b.z-eu.position.z);if(d<bd){bd=d;best=i;bs=s}})});
  if(best<0){aviso('Chegue perto de um banco livre','🪑');return}
  pv.x=pv.y=pv.z=pv.h=0;sentaEm(eu,best,bs)}
document.getElementById('btnT').addEventListener('click',sentar);
document.getElementById('mnb').addEventListener('click',function(){var l=document.getElementById('mnl');l.style.display=l.style.display==='block'?'none':'block'});
document.getElementById('mnl').addEventListener('click',function(){this.style.display='none'});

// acenar, sair e avisos
function aviso(t,ic){var d=document.createElement('div');d.className='av';d.textContent=(ic||'🔌')+' '+t;document.getElementById('avisos').appendChild(d);setTimeout(function(){d.remove()},4200)}
function acenar(){if(!eu)return;eu.userData.ac=2.2;balao(eu,'Oi! 👋');if(ws&&ws.readyState===1)ws.send('{"t":"w"}');
  npcs.forEach(function(n){if(Math.hypot(n.a.position.x-eu.position.x,n.a.position.z-eu.position.z)<12){n.a.userData.ac=2.2;balao(n.a,'Oi, '+nomeAtual+'!')}})}
function avisaSaida(){try{navigator.sendBeacon('/api/sair',new Blob([JSON.stringify({token:tokenC})],{type:'application/json'}))}catch(e){}}
function sair(){if(!eu)return;aviso(nomeAtual+' desligou');avisaSaida();netStop();levanta(eu);
  vistos[meuU]=1;S.remove(eu);eu=null;tokenC=null;window.uiOn=0;
  ['hud','joy','ap','mn','mnl'].forEach(function(i){document.getElementById(i).style.display='none'});
  document.getElementById('ov').style.display='flex';document.getElementById('erro').textContent=''}
document.getElementById('btnW').addEventListener('click',acenar);
document.getElementById('btnS').addEventListener('click',sair);
document.getElementById('btnJ').addEventListener('pointerdown',function(e){e.preventDefault();pulo=1});
addEventListener('pagehide',function(){if(eu&&tokenC)avisaSaida()});
